<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbi Regolari</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<a href="index.html" class="top-bar">
  🎮 Mini Giochi Italiano
</a>

<div class="card">

  <h2>ARE • ERE • IRE</h2>

  <p id="domanda"></p>

  <div id="bottoni"></div>

  <button id="nextBtn" class="next-btn" onclick="nuovaDomanda()" disabled>Avanti</button>

</div>

<script>

// DATI
const verbs = [
{inf:'mangiare', forms:['mangio','mangi','mangia','mangiamo','mangiate','mangiano']},
{inf:'credere', forms:['credo','credi','crede','crediamo','credete','credono']},
{inf:'dormire', forms:['dormo','dormi','dorme','dormiamo','dormite','dormono']},
{inf:'parlare', forms:['parlo','parli','parla','parliamo','parlate','parlano']},
{inf:'studiare', forms:['studio','studi','studia','studiamo','studiate','studiano']},
{inf:'lavorare', forms:['lavoro','lavori','lavora','lavoriamo','lavorate','lavorano']},
{inf:'abitare', forms:['abito','abiti','abita','abitiamo','abitate','abitano']},
{inf:'leggere', forms:['leggo','leggi','legge','leggiamo','leggete','leggono']},
{inf:'scrivere', forms:['scrivo','scrivi','scrive','scriviamo','scrivete','scrivono']},
{inf:'prendere', forms:['prendo','prendi','prende','prendiamo','prendete','prendono']},
{inf:'vivere', forms:['vivo','vivi','vive','viviamo','vivete','vivono']},
{inf:'partire', forms:['parto','parti','parte','partiamo','partite','partono']},
{inf:'finire', forms:['finisco','finisci','finisce','finiamo','finite','finiscono']}
];

const subjects = ['Io','Tu','Lui/Lei','Noi','Voi','Loro'];

let rispostaCorretta;
let usati = [];

// NUOVA DOMANDA
function nuovaDomanda(){

  document.getElementById('nextBtn').disabled = true;

  // controllo fine
  if(usati.length === verbs.length){
    document.getElementById('domanda').innerText = "✅ Completato!";
    document.getElementById('bottoni').innerHTML = "";
    return;
  }

  // scegli verbo non usato
  let disponibili = verbs.filter(v => !usati.includes(v));
  let verbo = disponibili[Math.floor(Math.random()*disponibili.length)];

  usati.push(verbo);

  // scegli persona
  let i = Math.floor(Math.random()*6);

  rispostaCorretta = verbo.forms[i];

  document.getElementById('domanda').innerText =
    subjects[i] + " (" + verbo.inf + ")";

  // opzioni
  let opzioni = [...verbo.forms];

  opzioni.sort(() => Math.random() - 0.5);
  opzioni = opzioni.slice(0,4);

  if(!opzioni.includes(rispostaCorretta)){
    opzioni[0] = rispostaCorretta;
  }

  opzioni.sort(() => Math.random() - 0.5);

  let html = '';

  for(let o of opzioni){
    html += `<button onclick="controlla('${o}')">${o}</button>`;
  }

  document.getElementById('bottoni').innerHTML = html;
}

// CONTROLLO
function controlla(val){

  let bottoni = document.querySelectorAll('#bottoni button');

  bottoni.forEach(btn => {

    // corretta → verde
    if(btn.innerText === rispostaCorretta){
      btn.classList.add('correct');
    }

    // sbagliata → rossa
    if(btn.innerText === val && val !== rispostaCorretta){
      btn.classList.add('wrong');
    }

    btn.disabled = true;
  });

  document.getElementById('nextBtn').disabled = false;
}

// AVVIO
nuovaDomanda();

</script>

</body>
</html>
