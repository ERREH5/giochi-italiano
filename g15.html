<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In o Al</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<a href="index.html" class="top-bar">
  🎮 Mini Giochi Italiano
</a>

<div class="card">

  <h2>📍 In o al?</h2>

  <p id="domanda"></p>

  <div id="bottoni"></div>

  <button id="nextBtn" class="next-btn" onclick="nuovaDomanda()" disabled>Avanti</button>

</div>

<script>

// DATI → logica CORRETTA (luogo, non verbo)
const dati = [
{text:"Sono __ cucina.", correct:"in"},
{text:"Vado __ cucina.", correct:"in"},

{text:"Sono __ bagno.", correct:"in"},
{text:"Vado __ bagno.", correct:"in"},

{text:"Sono __ ufficio.", correct:"in"},
{text:"Vado __ ufficio.", correct:"in"},

{text:"Sono __ classe.", correct:"in"},
{text:"Vado __ classe.", correct:"in"},

{text:"Sono __ montagna.", correct:"in"},
{text:"Vado __ montagna.", correct:"in"},

// --- AL ---
{text:"Sono __ bar.", correct:"al"},
{text:"Vado __ bar.", correct:"al"},

{text:"Sono __ ristorante.", correct:"al"},
{text:"Vado __ ristorante.", correct:"al"},

{text:"Sono __ cinema.", correct:"al"},
{text:"Vado __ cinema.", correct:"al"},

{text:"Sono __ supermercato.", correct:"al"},
{text:"Vado __ supermercato.", correct:"al"},

{text:"Sono __ parco.", correct:"al"},
{text:"Vado __ parco.", correct:"al"}
];

let usati = [];
let rispostaCorretta;

// NUOVA DOMANDA
function nuovaDomanda(){

  document.getElementById('nextBtn').disabled = true;

  if(usati.length === dati.length){
    document.getElementById('domanda').innerText = "✅ Completato!";
    document.getElementById('bottoni').innerHTML = "";
    return;
  }

  let disponibili = dati.filter(x => !usati.includes(x));
  let curr = disponibili[Math.floor(Math.random()*disponibili.length)];

  usati.push(curr);

  rispostaCorretta = curr.correct;

  document.getElementById('domanda').innerText = curr.text;

  let opzioni = ["in", "al"];

  opzioni.sort(() => Math.random() - 0.5);

  let html = '';

  for(let o of opzioni){
    html += `<button onclick="controlla('${o}')">${o}</button>`;
  }

  document.getElementById('bottoni').innerHTML = html;
}

// CONTROLLO
function controlla(val){

  let bottoni = document.querySelectorAll('#bottoni button');

  bottoni.forEach(btn => {

    if(btn.innerText === rispostaCorretta){
      btn.classList.add('correct');
    }

    if(btn.innerText === val && val !== rispostaCorretta){
      btn.classList.add('wrong');
    }

    btn.disabled = true;
  });

  document.getElementById('nextBtn').disabled = false;
}

// AVVIO
nuovaDomanda();

</script>

</body>
</html>
