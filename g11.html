<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi piace - presente, imperfetto, passato prossimo</title>
<link rel="stylesheet" href="style.css">
<style>
/* piccolo extra per allineare i contatori */
.stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
  font-size: 14px;
  color: #555;
  background: #f0f0f0;
  padding: 6px 10px;
  border-radius: 10px;
}
</style>
</head>
<body>

<a href="index.html" class="top-bar">
  🎮 Mini Giochi Italiano
</a>

<!-- ========== GIOCO 1: presente ========== -->
<div class="card">
  <h2>💛 Mi piace / Mi piacciono (presente)</h2>
  <div class="stats">
    <span>📋 Frase: <span id="contatore1">1</span>/<span id="totale1"></span></span>
  </div>
  <p id="domanda1"></p>
  <div id="bottoni1"></div>
  <button id="nextBtn1" class="next-btn" onclick="prossimaDomanda1()" disabled>Avanti</button>
</div>

<!-- ========== GIOCO 2: imperfetto ========== -->
<div class="card">
  <h2>💛 Mi piaceva / Mi piacevano (imperfetto)</h2>
  <div class="stats">
    <span>📋 Frase: <span id="contatore2">1</span>/<span id="totale2"></span></span>
  </div>
  <p id="domanda2"></p>
  <div id="bottoni2"></div>
  <button id="nextBtn2" class="next-btn" onclick="prossimaDomanda2()" disabled>Avanti</button>
</div>

<!-- ========== GIOCO 3: passato prossimo ========== -->
<div class="card">
  <h2>💛 Mi è piaciuto/a / Mi sono piaciuti/e (passato prossimo)</h2>
  <div class="stats">
    <span>📋 Frase: <span id="contatore3">1</span>/<span id="totale3"></span></span>
  </div>
  <p id="domanda3"></p>
  <div id="bottoni3"></div>
  <button id="nextBtn3" class="next-btn" onclick="prossimaDomanda3()" disabled>Avanti</button>
</div>

<script>
// ============================================================
// GIOCO 1 (presente) – con contatore e bottone ricomincia
// ============================================================
const dati1 = [
  {text:"______ il gelato al cioccolato.", correct:"mi piace"},
  {text:"______ i cani.", correct:"mi piacciono"},
  {text:"______ leggere libri.", correct:"mi piace"},
  {text:"______ le serie TV.", correct:"mi piacciono"},
  {text:"______ la pizza.", correct:"mi piace"},
  {text:"______ andare al mare.", correct:"mi piace"},
  {text:"______ le persone gentili.", correct:"mi piacciono"},
  {text:"______ il calcio.", correct:"mi piace"},
  {text:"______ le vacanze estive.", correct:"mi piacciono"},
  {text:"______ la musica classica.", correct:"mi piace"},
  {text:"______ i film d’azione.", correct:"mi piacciono"},
  {text:"______ studiare italiano.", correct:"mi piace"}
];
let usati1 = [];
let rispostaCorretta1;
let domandaIndex1 = 0;
let domandeTotali1 = dati1.length;
let giocoCompletato1 = false;

function aggiornaContatore1() {
  document.getElementById("contatore1").innerText = domandaIndex1 + 1;
  document.getElementById("totale1").innerText = domandeTotali1;
}

function mostraFineGioco1() {
  if (giocoCompletato1) return;
  giocoCompletato1 = true;
  document.getElementById('domanda1').innerHTML = "✅ Completato! ✅";
  document.getElementById('bottoni1').innerHTML = "";
  document.getElementById('nextBtn1').disabled = true;

  let ricominciaBtn = document.createElement("button");
  ricominciaBtn.innerText = "🔄 Ricomincia gioco 1";
  ricominciaBtn.style.marginTop = "15px";
  ricominciaBtn.style.width = "100%";
  ricominciaBtn.onclick = () => inizializzaGioco1();
  let container = document.getElementById('bottoni1');
  let old = container.querySelector(".ricomincia-btn1");
  if (old) old.remove();
  ricominciaBtn.classList.add("ricomincia-btn1");
  container.appendChild(ricominciaBtn);
}

function nuovaDomanda1() {
  if (usati1.length === domandeTotali1) {
    mostraFineGioco1();
    return;
  }
  let disponibili = dati1.filter(x => !usati1.includes(x));
  let curr = disponibili[Math.floor(Math.random() * disponibili.length)];
  usati1.push(curr);
  rispostaCorretta1 = curr.correct;
  document.getElementById('domanda1').innerHTML = curr.text;
  let opzioni = ["mi piace", "mi piacciono"];
  opzioni.sort(() => Math.random() - 0.5);
  let html = '';
  for (let o of opzioni) {
    html += `<button onclick="controlla1('${o}')">${o}</button>`;
  }
  document.getElementById('bottoni1').innerHTML = html;
  document.getElementById('nextBtn1').disabled = true;
}

function controlla1(val) {
  let bottoni = document.querySelectorAll('#bottoni1 button');
  bottoni.forEach(btn => {
    if (btn.innerText === rispostaCorretta1) btn.classList.add('correct');
    if (btn.innerText === val && val !== rispostaCorretta1) btn.classList.add('wrong');
    btn.disabled = true;
  });
  document.getElementById('nextBtn1').disabled = false;
}

function prossimaDomanda1() {
  if (giocoCompletato1) return;
  if (usati1.length === domandeTotali1) {
    mostraFineGioco1();
    return;
  }
  domandaIndex1++;
  aggiornaContatore1();
  nuovaDomanda1();
}

function inizializzaGioco1() {
  giocoCompletato1 = false;
  domandaIndex1 = 0;
  usati1 = [];
  aggiornaContatore1();
  nuovaDomanda1();
}

inizializzaGioco1();

</script>
</body>
