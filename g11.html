<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi piace</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<a href="index.html" class="top-bar">
  🎮 Mini Giochi Italiano
</a>

<div class="card">

  <h2>💛 Mi piace / Mi piacciono</h2>

  <p id="domanda"></p>

  <div id="bottoni"></div>

  <button id="nextBtn" class="next-btn" onclick="nuovaDomanda()" disabled>Avanti</button>

</div>

<script>

// DATI
const dati = [
{text:"______ il gelato al cioccolato.", correct:"mi piace"},
{text:"______ i cani.", correct:"mi piacciono"},
{text:"______ leggere libri.", correct:"mi piace"},
{text:"______ le serie TV.", correct:"mi piacciono"},
{text:"______ la pizza.", correct:"mi piace"},
{text:"______ andare al mare.", correct:"mi piace"},
{text:"______ le persone gentili.", correct:"mi piacciono"},
{text:"______ il calcio.", correct:"mi piace"},
{text:"______ le vacanze estive.", correct:"mi piacciono"},
{text:"______ la musica classica.", correct:"mi piace"},
{text:"______ i film d’azione.", correct:"mi piacciono"},
{text:"______ studiare italiano.", correct:"mi piace"}
];

let usati = [];
let rispostaCorretta;

// NUOVA DOMANDA
function nuovaDomanda(){

  document.getElementById('nextBtn').disabled = true;

  if(usati.length === dati.length){
    document.getElementById('domanda').innerText = "✅ Completato!";
    document.getElementById('bottoni').innerHTML = "";
    return;
  }

  let disponibili = dati.filter(x => !usati.includes(x));
  let curr = disponibili[Math.floor(Math.random()*disponibili.length)];

  usati.push(curr);

  rispostaCorretta = curr.correct;

  document.getElementById('domanda').innerText = curr.text;

  let opzioni = ["mi piace", "mi piacciono"];

  opzioni.sort(() => Math.random() - 0.5);

  let html = '';

  for(let o of opzioni){
    html += `<button onclick="controlla('${o}')">${o}</button>`;
  }

  document.getElementById('bottoni').innerHTML = html;
}

// CONTROLLO
function controlla(val){

  let bottoni = document.querySelectorAll('#bottoni button');

  bottoni.forEach(btn => {

    if(btn.innerText === rispostaCorretta){
      btn.classList.add('correct');
    }

    if(btn.innerText === val && val !== rispostaCorretta){
      btn.classList.add('wrong');
    }

    btn.disabled = true;
  });

  document.getElementById('nextBtn').disabled = false;
}

// AVVIO
nuovaDomanda();

</script>

</body>
</html>
``
