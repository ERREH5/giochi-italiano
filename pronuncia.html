<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pronuncia</title>

<link rel="stylesheet" href="style.css">

<style>
<style>

h2 {
  margin-bottom: 10px;
}

/* separatori */
hr {
  margin: 20px 0;
  border: none;
  border-top: 2px solid #eee;
}

/* gruppi */
.group {
  margin-bottom: 20px;
}

/* bottone suono principale (CI, GI...) */
.group > button {
  font-size: 18px;
  padding: 10px 15px;
  background:#2c3e50;
}

/* parole */
.word {
  margin-top: 10px;
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
}

/* bottoni parole */
.word button {
  font-size: 14px;
  padding: 6px 10px;
  background:#3498db;
  display:flex;
  align-items:center;
  gap:5px;
}

/* hover */
.word button:hover {
  background:#2ecc71;
}


/* effetto visivo click */
button:active {
  transform: scale(0.95);
}

</style>
</style>

</head>

<body>

<a href="index.html" class="top-bar">
  🎮 Mini Giochi Italiano

<script>

let audio;
let isPlaying = false;

function play(sound){

  if(isPlaying) return;

  audio = new Audio("audio/" + sound + ".mp3");
  isPlaying = true;

  audio.play();

  audio.onended = function(){
    isPlaying = false;
  };
}

</script>
