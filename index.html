<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Giochi Italiano</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Stili originali per l'accordion principale */
  .section-toggle {
    background: linear-gradient(90deg, #2c3e50, #34495e);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 8px;
  }
  
  .section-toggle:hover {
    filter: brightness(0.95);
    transform: translateY(-2px);
  }
  
  .section-toggle:active {
    transform: scale(0.98);
  }
  
  .toggle-icon {
    font-size: 1.2rem;
    transition: transform 0.2s ease;
  }
  
  .section-toggle.active .toggle-icon {
    transform: rotate(90deg);
  }
  
  .games-group {
    display: none;
    margin-bottom: 15px;
    padding-left: 5px;
  }
  
  .games-group.show {
    display: block;
  }
  
  .game-btn {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    background: linear-gradient(90deg, #4facfe, #00c6ff);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    padding-left: 25px;
  }
  
  .game-btn:hover {
    transform: translateX(5px);
    filter: brightness(0.95);
  }
  
  .game-btn:active {
    transform: scale(0.98);
  }
  
  /* Stili per le sottocategorie (accordion annidato) */
  .sub-toggle {
    background: linear-gradient(90deg, #3a4a5a, #4a5a6a);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 6px;
    margin-top: 4px;
  }
  
  .sub-toggle:hover {
    filter: brightness(0.95);
    transform: translateX(3px);
  }
  
  .sub-toggle:active {
    transform: scale(0.98);
  }
  
  .sub-toggle .toggle-icon {
    font-size: 1rem;
  }
  
  .sub-toggle.active .toggle-icon {
    transform: rotate(90deg);
  }
  
  .sub-games {
    display: none;
    padding-left: 15px;  /* indentazione rispetto al sottotitolo */
    margin-bottom: 8px;
  }
  
  .sub-games.show {
    display: block;
  }
  
  .sub-games .game-btn {
    background: linear-gradient(90deg, #6ab0fe, #4facfe);
    padding-left: 35px;  /* ulteriore indentazione per i giochi dentro la sottocategoria */
    font-size: 0.9rem;
    margin: 4px 0;
  }
  
  .legenda-separatore {
    font-size: 0.85rem;
    color: #888;
    margin-top: 10px;
    margin-bottom: 5px;
    padding-left: 5px;
    display: none;
  }
</style>
</head>

<body>

<header>
<a href="index.html" class="top-bar">
  🎮 Mini Giochi Italiano
</a>
</header>

<div class="container">
  <div class="card">

    <!-- Sezione BASI -->
    <button class="section-toggle" data-group="basi">
      <span>📖 BASI</span>
      <span class="toggle-icon">▶</span>
    </button>
    <div class="games-group" data-group="basi">
      <button class="game-btn" onclick="go('pronuncia.html')">🔊 Pronuncia</button>
      <button class="game-btn" onclick="go('presentarsi.html')">👋 Presentarsi</button>
      <button class="game-btn" onclick="go('g7.html')">🎨 Colori</button>
      <button class="game-btn" onclick="go('g8.html')">🔢 Numeri</button>
      <button class="game-btn" onclick="go('g12.html')">📅 Giorni, Mesi, Stagioni</button>
    </div>

    <!-- Sezione VOCABOLARIO -->
    <button class="section-toggle" data-group="vocabolario">
      <span>📚 VOCABOLARIO</span>
      <span class="toggle-icon">▶</span>
    </button>
    <div class="games-group" data-group="vocabolario">
      <button class="game-btn" onclick="go('meteo.html')">☀️ Meteo</button>
      <button class="game-btn" onclick="go('g3.html')">🏠 Casa</button>
      <button class="game-btn" onclick="go('g14.html')">🧳 Oggetti</button>
      <button class="game-btn" onclick="go('routine.html')">🔄 Routine</button>
      <button class="game-btn" onclick="go('mappa.html')">🗺️ Chiedere indicazioni</button>
    </div>

    <!-- Sezione FRASI -->
    <button class="section-toggle" data-group="frasi">
      <span>💬 Articoli, Pronomi e Preposizioni</span>
      <span class="toggle-icon">▶</span>
    </button>
    <div class="games-group" data-group="frasi">
      <button class="game-btn" onclick="go('g13.html')">👨‍👩‍👧‍👦 Pronomi possessivi</button>
      <button class="game-btn" onclick="go('g15.html')">📍 Preposizioni In / Al</button>
      <button class="game-btn" onclick="go('g17.html')">⚡️ Preposizioni articolate</button>
       <button class="game-btn" onclick="go('connettivi.html')">🔗 Connettivi</button>
    </div>

    <!-- Sezione VERBI (con sottocategorie) -->
    <button class="section-toggle" data-group="verbi">
      <span>🔤 VERBI</span>
      <span class="toggle-icon">▶</span>
    </button>
    <div class="games-group" data-group="verbi">

      <!-- Sottocategoria: Verbi Presente -->
      <button class="sub-toggle" data-group="verbi-presente">
        <span>📗 Verbi Presente</span>
        <span class="toggle-icon">▶</span>
      </button>
      <div class="sub-games" data-group="verbi-presente">
        <button class="game-btn" onclick="go('g1.html')">📘 Verbo Essere e Avere</button>
        <button class="game-btn" onclick="go('g2.html')">📗 Verbi Regolari</button>
        <button class="game-btn" onclick="go('verbi_riflessivi.html')">🪞 Verbi Riflessivi</button>
        <button class="game-btn" onclick="go('presente_progressivo.html')">➡️ Presente Progressivo</button>
        <button class="game-btn" onclick="go('g5.html')">⚡ Verbi Presente Irregolari</button>
        <button class="game-btn" onclick="go('verbi_presente.html')">📖 Verbi Presente (difficile)</button>
        <button class="game-btn" onclick="go('g11.html')">💛 Verbo Piacere</button>
      </div>

      <!-- Sottocategoria: Verbi Passato -->
      <button class="sub-toggle" data-group="verbi-passato">
        <span>📕 Verbi Passato</span>
        <span class="toggle-icon">▶</span>
      </button>
      <div class="sub-games" data-group="verbi-passato">
        <button class="game-btn" onclick="go('g9.html')">✏️ Participio Passato Irregolare</button>
        <button class="game-btn" onclick="go('g10.html')">⚖️ Passato Prossimo con Essere o Avere</button>
        <button class="game-btn" onclick="go('verbi_riflessivi_passato.html')">⏳ Passato Prossimo Verbi Riflessivi</button>
        <button class="game-btn" onclick="go('g16.html')">⏳ Imperfetto</button>
        <button class="game-btn" onclick="go('imperfetto_passato_prossimo.html')">📖 Imperfetto o Passato Prossimo?</button>
      </div>

    </div> <!-- fine games-group verbi -->
    
  </div> <!-- fine card -->
  
</div> <!-- fine container -->

<div style="text-align: center; font-size: 0.75rem; color: #aaa; margin-top: 15px;">
  versione: beta 0.1.5
</div>

<script>
function go(page){
  window.location.href = page;
}

// Gestione toggle per TUTTI i pulsanti con classe .section-toggle e .sub-toggle
// (funziona allo stesso modo per entrambi i livelli)
document.querySelectorAll('.section-toggle, .sub-toggle').forEach(toggle => {
  toggle.addEventListener('click', function(e) {
    e.stopPropagation();
    
    // Ottieni il gruppo associato (data-group)
    const groupName = this.getAttribute('data-group');
    // Cerca il div con classe .games-group o .sub-games che ha lo stesso data-group
    // Usiamo un selettore che prende entrambi i tipi di contenitore
    let targetGroup = document.querySelector(`.games-group[data-group="${groupName}"]`);
    if (!targetGroup) {
      targetGroup = document.querySelector(`.sub-games[data-group="${groupName}"]`);
    }
    
    if (targetGroup) {
      // Toggle classe active sul pulsante
      this.classList.toggle('active');
      // Toggle visibilità del gruppo
      targetGroup.classList.toggle('show');
    }
  });
});

// Opzionale: apri la prima sezione (BASIS) all'avvio (puoi commentare se preferisci)
// const firstToggle = document.querySelector('.section-toggle');
// if(firstToggle) {
//   firstToggle.classList.add('active');
//   const firstGroup = document.querySelector(`.games-group[data-group="${firstToggle.getAttribute('data-group')}"]`);
//   if(firstGroup) firstGroup.classList.add('show');
// }
</script>

</body>
</html>
