<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Essere / Avere</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<a href="index.html" class="top-bar">
  🎮 Mini Giochi Italiano
</a>

<div class="card">
  <h2>Essere o Avere</h2>

  <p id="domanda"></p>

  <div id="bottoni"></div>

  <button class="next-btn" onclick="nuovaDomanda()">Avanti</button>
</div>

<script>

// DATI
const dati = [
  {s:'Io', essere:'sono', avere:'ho'},
  {s:'Tu', essere:'sei', avere:'hai'},
  {s:'Lui', essere:'è', avere:'ha'},
  {s:'Noi', essere:'siamo', avere:'abbiamo'},
  {s:'Voi', essere:'siete', avere:'avete'},
  {s:'Loro', essere:'sono', avere:'hanno'},
    // senza pronomi
{s:'Mio cugino', essere:'è', avere:'ha'},
{s:'Marco', essere:'è', avere:'ha'},
{s:'I miei genitori', essere:'sono', avere:'hanno'},
{s:'I miei amici', essere:'sono', avere:'hanno'},
{s:'La mia professoressa', essere:'è', avere:'ha'},
{s:'tuo fratello', essere:'è', avere:'ha'},
{s:'Le mie sorelle', essere:'sono', avere:'hanno'},
{s:'Il cane', essere:'è', avere:'ha'},
{s:'I bambini', essere:'sono', avere:'hanno'},
{s:'Il ristorante', essere:'è', avere:'ha'},
{s:'Mio padre', essere:'è', avere:'ha'},
{s:'Mia madre', essere:'è', avere:'ha'},
{s:'I miei nonni', essere:'sono', avere:'hanno'},
{s:'Il tuo amico', essere:'è', avere:'ha'},
{s:'Le mie amiche', essere:'sono', avere:'hanno'},
{s:'Il bambino', essere:'è', avere:'ha'},
{s:'Gli studenti', essere:'sono', avere:'hanno'},
{s:'Il professore', essere:'è', avere:'ha'},
{s:'La ragazza', essere:'è', avere:'ha'},
{s:'I colleghi', essere:'sono', avere:'hanno'}
];

const tutte = ['sono','sei','è','siamo','siete','ho','hai','ha','abbiamo','avete','hanno'];

let rispostaCorretta;

// ✅ nuovo: traccia usati
let usati = [];

// NUOVA DOMANDA
function nuovaDomanda(){

  // ✅ controllo fine gioco
  if(usati.length === dati.length){
    document.getElementById('domanda').innerText = "✅ Completato!";
    document.getElementById('bottoni').innerHTML = "";
    return;
  }

  // scegli non usato
  let disponibili = dati.filter(x => !usati.includes(x));
  let soggetto = disponibili[Math.floor(Math.random()*disponibili.length)];

  usati.push(soggetto);

  // verbo random
  let tipo = Math.random() > 0.5 ? 'essere' : 'avere';

  rispostaCorretta = soggetto[tipo];

  document.getElementById('domanda').innerText =
    soggetto.s + ' (' + tipo + ')';

  // opzioni
  let opzioni = [rispostaCorretta];

  while(opzioni.length < 4){
    let x = tutte[Math.floor(Math.random()*tutte.length)];
    if(!opzioni.includes(x)) opzioni.push(x);
  }

  opzioni.sort(() => Math.random() - 0.5);

  let html = '';

  for(let i=0;i<opzioni.length;i++){
    html += `<button onclick="controlla('${opzioni[i]}')">${opzioni[i]}</button>`;
  }

  document.getElementById('bottoni').innerHTML = html;
}

// CONTROLLO
function controlla(val){

  let bottoni = document.querySelectorAll('#bottoni button');

  bottoni.forEach(btn => {

    // bottone corretto → verde
    if(btn.innerText === rispostaCorretta){
      btn.classList.add('correct');
    }

    // bottone cliccato sbagliato → rosso
    if(btn.innerText === val && val !== rispostaCorretta){
      btn.classList.add('wrong');
    }

    btn.disabled = true;
  });

  // abilita avanti
  document.getElementById('nextBtn').disabled = false;
}

// AVVIO
nuovaDomanda();

</script>

</body>
</html>
