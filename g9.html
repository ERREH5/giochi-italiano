<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Participio Passato</title>

<link rel="stylesheet" href="style.css">

<style>
.word {
  font-size: 22px;
  letter-spacing: 5px;
}
</style>

</head>

<body>

<a href="index.html" class="top-bar">
  🎮 Mini Giochi Italiano
</a>

<div class="card">

  <h2>✏️ Participio Passato</h2>

  <p id="domanda"></p>

  <div id="word" class="word"></div>

  <div id="letters"></div>

  <p id="res"></p>

  <button id="nextBtn" class="next-btn" onclick="nuovaDomanda()">Avanti</button>

</div>

<script>

// DATI
const dati = [
{inf:'fare',pp:'fatto'},
{inf:'dire',pp:'detto'},
{inf:'scrivere',pp:'scritto'},
{inf:'leggere',pp:'letto'},
{inf:'prendere',pp:'preso'},
{inf:'scendere',pp:'sceso'},
{inf:'chiedere',pp:'chiesto'},
{inf:'rispondere',pp:'risposto'},
{inf:'vedere',pp:'visto'},
{inf:'venire',pp:'venuto'},
{inf:'aprire',pp:'aperto'},
{inf:'coprire',pp:'coperto'},
{inf:'morire',pp:'morto'},
{inf:'nascere',pp:'nato'},
{inf:'mettere',pp:'messo'},
{inf:'promettere',pp:'promesso'},
{inf:'succedere',pp:'successo'},
{inf:'accendere',pp:'acceso'},
{inf:'chiudere',pp:'chiuso'},
{inf:'spendere',pp:'speso'},
{inf:'rompere',pp:'rotto'},
{inf:'scegliere',pp:'scelto'},
{inf:'correre',pp:'corso'},
{inf:'piangere',pp:'pianto'},
{inf:'vincere',pp:'vinto'},
{inf:'vivere',pp:'vissuto'},
{inf:'offrire',pp:'offerto'},
{inf:'soffrire',pp:'sofferto'},
{inf:'tradurre',pp:'tradotto'},
{inf:'produrre',pp:'prodotto'},
{inf:'condurre',pp:'condotto'},
{inf:'giungere',pp:'giunto'},
{inf:'spegnere',pp:'spento'},
{inf:'togliere',pp:'tolto'},
{inf:'raccogliere',pp:'raccolto'},
{inf:'discutere',pp:'discusso'}
];

let usati = [];
let parola;
let guessed = [];

// NUOVA DOMANDA
function nuovaDomanda(){

  document.getElementById('res').innerText = "";

  if(usati.length === dati.length){
    document.getElementById('domanda').innerText = "✅ Completato!";
    document.getElementById('letters').innerHTML = "";
    document.getElementById('word').innerText = "";
    return;
  }

  let disponibili = dati.filter(x => !usati.includes(x));
  let curr = disponibili[Math.floor(Math.random()*disponibili.length)];

  usati.push(curr);

  parola = curr.pp;
  guessed = [];

  document.getElementById('domanda').innerText =
    curr.inf + " → ?";

  disegnaParola();
  creaLettere();
}

// DISEGNA PAROLA
function disegnaParola(){
  document.getElementById('word').innerText =
    parola.split('').map(l => guessed.includes(l) ? l : '_').join(' ');
}

// CREA LETTERE
function creaLettere(){

  let righe = [
    "qwertyuiop",
    "asdfghjkl",
    "zxcvbnm"
  ];

  let html = '';

  for(let riga of righe){

    html += '<div class="keyboard">';

    for(let l of riga){
      html += `<button onclick="scegliLettera('${l}')">${l}</button>`;
    }

    html += '</div>';
  }

  document.getElementById('letters').innerHTML = html;
}

// CLICK LETTERA
function scegliLettera(l){

  if(guessed.includes(l)) return;

  guessed.push(l);

  let bottoni = document.querySelectorAll('#letters button');

  bottoni.forEach(btn => {
    if(btn.innerText === l){

      if(parola.includes(l)){
        btn.classList.add('correct');
      } else {
        btn.classList.add('wrong');
      }

      btn.disabled = true;
    }
  });

  disegnaParola();

  // VITTORIA
  if(!document.getElementById('word').innerText.includes('_')){
    document.getElementById('res').innerText =
      "🎉 Corretto! Premi Avanti";
    document.getElementById('letters').innerHTML = "";
  }
}

document.addEventListener('keydown', function(e){

  let lettera = e.key.toLowerCase();

  // controlla che sia una lettera
  if(lettera.match(/^[a-z]$/)){

    scegliLettera(lettera);

  }

});


// AVVIO
nuovaDomanda();

</script>

</body>
</html>
