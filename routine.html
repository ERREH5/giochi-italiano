<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routine - Immagini</title>

<link rel="stylesheet" href="style.css">

<style>
#imgBox {
  width: 200px;
  height: 200px;
  margin: 15px auto;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f5f5f5;
  border-radius:12px;
}

#imgBox img {
  max-width:100%;
  max-height:100%;
}
</style>

</head>

<body>

<a href="index.html" class="top-bar">
  🎮 Mini Giochi Italiano
</a>

<div class="card">

  <h2>🔄 Routine giornaliera</h2>

  <div id="imgBox">
    <img id="img">
  </div>

  <p id="domanda">Che cosa vedi?</p>

  <div id="bottoni"></div>

  <button id="nextBtn" class="next-btn" onclick="nuovaDomanda()" disabled>Avanti</button>

</div>

<script>

// ✅ DATI (metti le immagini qui)
const dati = [
{word:"Mi sveglio", img:"images/routine/svegliarsi.jpg"},
{word:"Mi alzo", img:"images/routine/alzarsi.jpg"},
{word:"Faccio colazione", img:"images/routine/colazione.jpg"},
{word:"Mi vesto", img:"images/routine/vestirsi.jpg"},
{word:"Vado al lavoro", img:"images/routine/lavoro.jpg"},
{word:"Pranzo", img:"images/routine/pranzo.jpg"},
{word:"Torno a casa", img:"images/routine/tornare.jpg"},
{word:"Ceno fuori con amici", img:"images/routine/cena.jpg"},
{word:"Guardo la TV", img:"images/routine/tv.jpg"},
{word:"Vado a dormire", img:"images/routine/dormire.jpg"},
{word:"Leggo un libro", img:"images/routine/leggere.jpg"},
{word:"Ascolto la musica", img:"images/routine/musica.jpg"},

{word:"Mi lavo", img:"images/routine/lavarsi.jpg"},
{word:"Mi faccio la doccia", img:"images/routine/doccia.jpg"},
{word:"Mi preparo", img:"images/routine/prepararsi.jpg"},
{word:"Mi pettino", img:"images/routine/pettinarsi.jpg"},
{word:"Mi lavo i denti", img:"images/routine/denti.jpg"},
{word:"Prendo l’autobus", img:"images/routine/autobus.jpg"},
{word:"Guido la macchina", img:"images/routine/macchina.jpg"},
{word:"Cammino", img:"images/routine/camminare.jpg"},
{word:"Studio", img:"images/routine/studiare.jpg"},
{word:"Scrivo", img:"images/routine/scrivere.jpg"},
{word:"Parlo con colleghi", img:"images/routine/parlare.jpg"},
{word:"Faccio una pausa", img:"images/routine/pausa.jpg"},
{word:"Faccio sport", img:"images/routine/sport.jpg"},
{word:"Esco con amici", img:"images/routine/amici.jpg"},
{word:"Bevo un caffè", img:"images/routine/caffe.jpg"},
{word:"Faccio la spesa", img:"images/routine/spesa.jpg"},
{word:"Mi rilasso", img:"images/routine/rilassarsi.jpg"},
{word:"Uso il telefono", img:"images/routine/telefono.jpg"},
{word:"Navigo su internet", img:"images/routine/internet.jpg"},


];

let usati = [];
let rispostaCorretta;

// ✅ NUOVA DOMANDA
function nuovaDomanda(){

  document.getElementById('nextBtn').disabled = true;

  if(usati.length === dati.length){
    document.getElementById('domanda').innerText = "✅ Completato!";
    document.getElementById('bottoni').innerHTML = "";
    return;
  }

  let disponibili = dati.filter(x => !usati.includes(x));
  let curr = disponibili[Math.floor(Math.random()*disponibili.length)];

  usati.push(curr);

  rispostaCorretta = curr.word;

  document.getElementById('img').src = curr.img;

  let opzioni = [rispostaCorretta];

  while(opzioni.length < 4){
    let r = dati[Math.floor(Math.random()*dati.length)].word;
    if(!opzioni.includes(r)) opzioni.push(r);
  }

  opzioni.sort(()=>Math.random()-0.5);

  let html = "";

  for(let o of opzioni){
    html += `<button onclick="controlla('${o}')">${o}</button>`;
  }

  document.getElementById('bottoni').innerHTML = html;
}

// ✅ CONTROLLO
function controlla(val){

  let bottoni = document.querySelectorAll('#bottoni button');

  bottoni.forEach(btn=>{

    if(btn.innerText === rispostaCorretta){
      btn.classList.add('correct');
    }

    if(btn.innerText === val && val !== rispostaCorretta){
      btn.classList.add('wrong');
    }

    btn.disabled = true;
  });

  document.getElementById('nextBtn').disabled = false;
}

// START
nuovaDomanda();

</script>

</body>
</html>
``
