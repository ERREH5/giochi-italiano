<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards Français — Appel Client Vélo</title>
<style>
:root{
  --bg1:#0f172a; --bg2:#1e293b; --bg3:#0b1120;
  --card:#ffffff; --card-back:#f8fafc;
  --ink:#0f172a; --muted:#64748b;
  --accent:#14b8a6; --accent2:#f59e0b;
  --fr:#0f766e; --ipa:#7c3aed; --it:#b45309;
  --shadow:0 20px 50px rgba(0,0,0,.35);
  --radius:22px;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  min-height:100vh;
  background: radial-gradient(1200px 600px at 10% 0%, #1e3a5f 0%, transparent 55%),
              radial-gradient(1000px 500px at 100% 100%, #134e4a 0%, transparent 55%),
              linear-gradient(160deg, var(--bg3), var(--bg1) 60%, var(--bg2));
  color:#e2e8f0;
  display:flex; flex-direction:column; align-items:center;
  padding:24px 16px 60px;
  gap:18px;
}
header{width:100%;max-width:920px;text-align:center}
h1{
  font-size:clamp(22px,4vw,34px); font-weight:800; letter-spacing:-.02em;
  background:linear-gradient(90deg,#5eead4,#fbbf24,#f472b6);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-bottom:6px;
}
.sub{color:#94a3b8;font-size:14px}
.progress-wrap{width:100%;max-width:920px;height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin-top:6px}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#22d3ee,#fbbf24);transition:width .4s ease;border-radius:99px}

.filters{width:100%;max-width:920px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{
  border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.05);
  color:#cbd5e1; padding:7px 14px; border-radius:999px; cursor:pointer;
  font-size:13px; font-weight:600; transition:all .2s; user-select:none;
}
.chip:hover{background:rgba(255,255,255,.12); color:#fff}
.chip.active{background:linear-gradient(90deg,var(--accent),#0891b2); color:#00201d; border-color:transparent; box-shadow:0 6px 20px rgba(20,184,166,.35)}
.chip .count{opacity:.65;font-weight:500;margin-left:4px;font-size:11px}

.statsbar{width:100%;max-width:920px;display:flex;justify-content:space-between;align-items:center;color:#94a3b8;font-size:13px;padding:0 4px}
.statsbar b{color:#e2e8f0}

.card-area{width:100%;max-width:920px;perspective:1600px}
.flashcard{position:relative;width:100%;min-height:420px;cursor:pointer;transition:transform .4s}
.flashcard .inner{
  position:relative;width:100%;min-height:420px;
  transition:transform .7s cubic-bezier(.4,.2,.2,1);
  transform-style:preserve-3d;
}
.flashcard.flipped .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;
  background:linear-gradient(160deg,#ffffff, #f1f5f9);
  color:var(--ink); border-radius:var(--radius); box-shadow:var(--shadow);
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  padding:34px 34px 28px; display:flex; flex-direction:column;
  overflow:auto;
}
.face.back{transform:rotateY(180deg); background:linear-gradient(160deg,#ecfeff,#f0fdfa)}
.cat-tag{
  position:absolute;top:18px;right:18px;
  font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:5px 10px;border-radius:999px;background:rgba(20,184,166,.12);color:#0f766e;
}
.essential-star{position:absolute;top:18px;left:18px;color:#f59e0b;font-size:20px;line-height:1}
.fr-word{font-size:clamp(28px,5vw,46px);font-weight:800;letter-spacing:-.02em;color:var(--fr);margin-top:26px;line-height:1.15;word-break:break-word}
.ipa{display:inline-block;margin-top:14px;font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:clamp(15px,2.4vw,19px);color:var(--ipa);background:rgba(124,58,237,.09);padding:6px 12px;border-radius:10px}
.speaker{
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),#0891b2);color:#fff;
  margin-left:12px;vertical-align:middle;transition:transform .15s, box-shadow .2s;
  box-shadow:0 4px 14px rgba(20,184,166,.4);
}
.speaker:hover{transform:scale(1.08)}
.speaker:active{transform:scale(.95)}
.hint{color:#94a3b8;font-size:13px;margin-top:auto;padding-top:20px;text-align:center}

.it-word{font-size:clamp(22px,3.5vw,30px);font-weight:700;color:var(--it);margin-top:26px}
.example-box{margin-top:22px;padding:16px 18px;background:rgba(15,23,42,.05);border-left:4px solid var(--accent);border-radius:10px}
.example-fr{font-style:italic;font-size:clamp(15px,2.2vw,17px);color:#0f172a;line-height:1.5}
.example-fr b{color:var(--fr);font-style:normal;font-weight:700}
.example-it{font-size:14px;color:#64748b;margin-top:6px;line-height:1.5}
.context{margin-top:16px;font-size:13px;color:#475569;line-height:1.55}
.context b{color:#0f766e}

.controls{width:100%;max-width:920px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:4px}
.btn{
  border:none;cursor:pointer;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:700;
  background:rgba(255,255,255,.08);color:#e2e8f0;transition:all .18s;border:1px solid rgba(255,255,255,.12);
  display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#0891b2);color:#00201d;border-color:transparent;box-shadow:0 8px 24px rgba(20,184,166,.35)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3b1f00;border-color:transparent;box-shadow:0 8px 24px rgba(245,158,11,.35)}
.btn.known-active{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border-color:transparent}
.btn:disabled{opacity:.35;cursor:not-allowed}
.kbd{font-size:11px;opacity:.6;font-weight:500}

@media (max-width:640px){
  body{padding:16px 10px 40px}
  .flashcard,.flashcard .inner{min-height:480px}
  .face{padding:24px 20px 20px}
  .cat-tag{top:14px;right:14px;font-size:10px}
  .essential-star{top:14px;left:14px;font-size:17px}
  .fr-word{margin-top:36px}
  .controls .btn{padding:11px 14px;font-size:13px}
  .kbd{display:none}
}
</style>
</head>
<body>

<header>
  <h1>Flashcards Français 🇫🇷</h1>
  <div class="sub">Appel client — Magasin de vélos · Lausanne · Suisse</div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
</header>

<div class="filters" id="filters"></div>

<div class="statsbar">
  <div>🎯 Carta <b id="counter">1 / 1</b></div>
  <div>✓ Conosciute: <b id="knownCount">0</b></div>
</div>

<div class="card-area">
  <div class="flashcard" id="flashcard">
    <div class="inner">
      <div class="face front" id="faceFront">
        <div class="essential-star" id="star" style="display:none">★</div>
        <div class="cat-tag" id="catTag">—</div>
        <div class="fr-word" id="frWord">—</div>
        <div>
          <span class="ipa" id="ipa">—</span>
          <button class="speaker" id="speakerBtn" title="Ascolta la pronuncia" aria-label="Ascolta">🔊</button>
        </div>
        <div class="hint">Clicca la carta (o premi <span class="kbd">Spazio</span>) per vedere il significato →</div>
      </div>
      <div class="face back">
        <div class="cat-tag" id="catTagBack">—</div>
        <div class="it-word" id="itWord">—</div>
        <div class="example-box">
          <div class="example-fr" id="exampleFr">—</div>
          <div class="example-it" id="exampleIt">—</div>
        </div>
        <div class="context" id="context">—</div>
        <div class="hint">← Clicca per tornare al francese</div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn" id="prevBtn">◀ Prec <span class="kbd">←</span></button>
  <button class="btn primary" id="flipBtn">🔄 Gira <span class="kbd">Spazio</span></button>
  <button class="btn" id="nextBtn">Succ ▶ <span class="kbd">→</span></button>
  <button class="btn gold" id="shuffleBtn">🔀 Mescola</button>
  <button class="btn" id="knownBtn">✓ Conosco</button>
  <button class="btn" id="reviewBtn">🔁 Ripassa solo sconosciute</button>
</div>

<script>
/* ============================================================
   DATI — circa 200 flashcards
   ============================================================ */
const CARDS = [
/* ---------- 1. SALUTATIONS & CONTACT ---------- */
{fr:"Bonjour", ipa:"/bɔ̃.ʒuʁ/", it:"Buongiorno", ex:"Bonjour, je m'appelle Marco.", exIt:"Buongiorno, mi chiamo Marco.", ctx:"Saluto standard, formale e universale. Si usa fino al tardo pomeriggio.", cat:"Salutations", ess:true},
{fr:"Bonsoir", ipa:"/bɔ̃.swaʁ/", it:"Buonasera", ex:"Bonsoir, excusez-moi de vous appeler à cette heure.", exIt:"Buonasera, mi scusi per averla chiamata a quest'ora.", ctx:"Saluto serale. In Svizzera romanda si usa dopo le 18.", cat:"Salutations"},
{fr:"Enchanté", ipa:"/ɑ̃.ʃɑ̃.te/", it:"Piacere", ex:"Enchanté, Marc m'a beaucoup parlé de votre magasin.", exIt:"Piacere, Marc mi ha parlato molto del suo negozio.", ctx:"Si dice 'enchanté' se sei uomo, 'enchantée' se sei donna (si pronuncia uguale).", cat:"Salutations"},
{fr:"Je m'appelle…", ipa:"/ʒə ma.pɛl/", it:"Mi chiamo…", ex:"Je m'appelle Marco, je suis spécialisé dans les sites web pour vélos.", exIt:"Mi chiamo Marco, sono specializzato nei siti web per bici.", ctx:"Formula standard per presentarsi.", cat:"Salutations", ess:true},
{fr:"Je vous appelle de la part de…", ipa:"/ʒə vu za.pɛl də la paʁ də/", it:"La chiamo da parte di…", ex:"Je vous appelle de la part de Marc, de chez [fournisseur].", exIt:"La chiamo da parte di Marc, di [fornitore].", ctx:"Frase chiave del tuo script: identifica subito la fonte del referral.", cat:"Salutations", ess:true},
{fr:"Marc m'a parlé de vous", ipa:"/maʁk ma paʁ.le də vu/", it:"Marc mi ha parlato di lei", ex:"Marc m'a parlé de vous et m'a dit que vous cherchiez de l'aide pour votre site.", exIt:"Marc mi ha parlato di lei e mi ha detto che cercava aiuto per il sito.", ctx:"Più naturale e caldo di 'Marc mi ha raccomandato a lei'.", cat:"Salutations", ess:true},
{fr:"Est-ce que je vous dérange ?", ipa:"/ɛs kə ʒə vu de.ʁɑ̃ʒ/", it:"La disturbo?", ex:"Est-ce que je vous dérange en ce moment, ou vous avez cinq minutes ?", exIt:"La disturbo in questo momento, o ha cinque minuti?", ctx:"Formula di cortesia fondamentale all'inizio della chiamata.", cat:"Salutations", ess:true},
{fr:"Vous avez cinq minutes ?", ipa:"/vu za.ve sɛ̃k mi.nyl/", it:"Ha cinque minuti?", ex:"Vous avez cinq minutes pour parler de votre site ?", exIt:"Ha cinque minuti per parlare del suo sito?", ctx:"Chiedere il permesso di parlare aumenta la disponibilità dell'interlocutore.", cat:"Salutations"},
{fr:"Merci pour votre temps", ipa:"/mɛʁ.si puʁ vɔtʁ tɑ̃/", it:"Grazie per il suo tempo", ex:"Merci beaucoup pour votre temps, [Prénom].", exIt:"Grazie mille per il suo tempo, [Nome].", ctx:"Formula di chiusura professionale.", cat:"Salutations", ess:true},
{fr:"Je vous en prie", ipa:"/ʒə vu zɑ̃ pʁi/", it:"Prego", ex:"— Merci. — Je vous en prie.", exIt:"— Grazie. — Prego.", ctx:"Risposta formale al ringraziamento.", cat:"Salutations"},
{fr:"Pardon, vous pouvez répéter ?", ipa:"/paʁ.dɔ̃ vu pu.ve ʁe.pe.te/", it:"Scusi, può ripetere?", ex:"Pardon, vous pouvez répéter plus lentement ?", exIt:"Scusi, può ripetere più lentamente?", ctx:"Salvagente se non capisci. Nessun professionista ti giudicherà male.", cat:"Salutations", ess:true},
{fr:"Plus lentement, s'il vous plaît", ipa:"/plys lɑ̃t.mɑ̃ sil vu plɛ/", it:"Più lentamente, per favore", ex:"Excusez-moi, plus lentement, s'il vous plaît.", exIt:"Mi scusi, più lentamente, per favore.", ctx:"Da usare senza imbarazzo: mostra che vuoi capire bene.", cat:"Salutations", ess:true},
{fr:"Je ne comprends pas bien", ipa:"/ʒə nə kɔ̃.pʁɑ̃ pa bjɛ̃/", it:"Non capisco bene", ex:"Je ne comprends pas bien, vous pouvez reformuler ?", exIt:"Non capisco bene, può riformulare?", ctx:"Onesto e professionale.", cat:"Salutations"},
{fr:"Comment dit-on… en français ?", ipa:"/kɔ.mɑ̃ di tɔ̃ ɑ̃ fʁɑ̃.sɛ/", it:"Come si dice… in francese?", ex:"Comment dit-on 'e-commerce' en français ?", exIt:"Come si dice 'e-commerce' in francese?", ctx:"Utile quando ti manca un termine.", cat:"Salutations"},
{fr:"Excusez-moi", ipa:"/ɛks.ky.ze mwa/", it:"Mi scusi", ex:"Excusez-moi de vous déranger.", exIt:"Mi scusi per il disturbo.", ctx:"Formula di cortesia, più formale di 'pardon'.", cat:"Salutations"},
{fr:"Avec plaisir", ipa:"/a.vɛk plɛ.ziʁ/", it:"Con piacere", ex:"— Vous pouvez m'envoyer la vidéo ? — Avec plaisir.", exIt:"— Può inviarmi il video? — Con piacere.", ctx:"Accettare una richiesta con entusiasmo professionale.", cat:"Salutations"},
{fr:"Parfait", ipa:"/paʁ.fɛ/", it:"Perfetto", ex:"Parfait, je vous envoie la vidéo dans l'heure.", exIt:"Perfetto, le invio il video entro un'ora.", ctx:"Conferma di accordo.", cat:"Salutations"},
{fr:"Très bien", ipa:"/tʁɛ bjɛ̃/", it:"Molto bene", ex:"Très bien, c'est noté.", exIt:"Molto bene, annotato.", ctx:"Conferma.", cat:"Salutations"},
{fr:"D'accord", ipa:"/da.kɔʁ/", it:"D'accordo", ex:"D'accord, je comprends votre point de vue.", exIt:"D'accordo, capisco il suo punto di vista.", ctx:"Accordo o presa d'atto.", cat:"Salutations"},
{fr:"Bien sûr", ipa:"/bjɛ̃ syʁ/", it:"Certo", ex:"Bien sûr, je peux vous envoyer un résumé par email.", exIt:"Certo, posso inviarle un riassunto via email.", ctx:"Accettazione disponibile.", cat:"Salutations"},

/* ---------- 2. PRÉSENTATION PROFESSIONNELLE ---------- */
{fr:"Je suis spécialisé dans…", ipa:"/ʒə sɥi spe.sja.li.ze dɑ̃/", it:"Sono specializzato in…", ex:"Je suis spécialisé dans les sites web pour les magasins de vélos.", exIt:"Sono specializzato nei siti web per i negozi di bici.", ctx:"Frase identitaria: non dire 'sono un insegnante', di' la specializzazione.", cat:"Présentation", ess:true},
{fr:"J'accompagne des magasins comme le vôtre", ipa:"/ʒa.kɔ̃.paɲ de ma.ɡa.zɛ̃ kɔm lə votʁ/", it:"Affianco negozi come il suo", ex:"J'accompagne des magasins comme le vôtre pour développer leurs ventes en ligne.", exIt:"Affianco negozi come il suo per sviluppare le vendite online.", ctx:"Verbo 'accompagner' è molto usato nel business francese: significa affiancare, non solo aiutare.", cat:"Présentation", ess:true},
{fr:"Je travaille avec une petite équipe", ipa:"/ʒə tʁa.vaj a.vɛk yn pətit e.kip/", it:"Lavoro con una piccola squadra", ex:"Je travaille avec une petite équipe, donc je m'occupe personnellement de la relation client.", exIt:"Lavoro con una piccola squadra, quindi mi occupo personalmente della relazione con il cliente.", ctx:"Ti posiziona come strutturato ma non impersonale.", cat:"Présentation"},
{fr:"Je m'occupe personnellement de…", ipa:"/ʒə mɔ.kyp pɛʁ.sɔ.nɛl.mɑ̃ də/", it:"Mi occupo personalmente di…", ex:"Je m'occupe personnellement de la stratégie et du suivi.", exIt:"Mi occupo personalmente della strategia e del monitoraggio.", ctx:"Rassicura il cliente: non sarà gestito da un call center.", cat:"Présentation"},
{fr:"La relation client", ipa:"/la ʁə.la.sjɔ̃ kli.jɑ̃/", it:"La relazione con il cliente", ex:"La relation client, c'est le cœur de mon travail.", exIt:"La relazione con il cliente è il cuore del mio lavoro.", ctx:"Espressione chiave del business francese.", cat:"Présentation"},
{fr:"La stratégie", ipa:"/la stʁa.te.ʒi/", it:"La strategia", ex:"On définit d'abord la stratégie, ensuite on exécute.", exIt:"Prima definiamo la strategia, poi eseguiamo.", ctx:"Mostra che non sei solo un esecutore tecnico.", cat:"Présentation"},
{fr:"Mon équipe et moi", ipa:"/mɔ̃ ne.kip e mwa/", it:"La mia squadra ed io", ex:"Mon équipe et moi, on travaille uniquement avec des magasins de vélos.", exIt:"La mia squadra ed io lavoriamo solo con negozi di bici.", ctx:"Formula elegante per dire 'io e il mio team'.", cat:"Présentation"},
{fr:"Je connais bien Marc", ipa:"/ʒə kɔ.nɛ bjɛ̃ maʁk/", it:"Conosco bene Marc", ex:"Je connais bien Marc, on travaille ensemble depuis un moment.", exIt:"Conosco bene Marc, lavoriamo insieme da un po'.", ctx:"Se ti chiede 'ma lei conosce Marc?'.", cat:"Présentation", ess:true},
{fr:"On travaille ensemble", ipa:"/ɔ̃ tʁa.vaj ɑ̃.sɑ̃bl/", it:"Lavoriamo insieme", ex:"Oui, on travaille ensemble depuis plusieurs mois.", exIt:"Sì, lavoriamo insieme da diversi mesi.", ctx:"Conferma la relazione professionale.", cat:"Présentation"},
{fr:"Il m'a recommandé à vous", ipa:"/il ma ʁə.kɔ.mɑ̃.de a vu/", it:"Mi ha raccomandato a lei", ex:"Marc m'a recommandé à vous en pensant que je pouvais vous aider.", exIt:"Marc mi ha raccomandato a lei pensando che potessi aiutarla.", ctx:"Formula per rafforzare la fiducia del referral.", cat:"Présentation"},
{fr:"Je vous contacte parce que…", ipa:"/ʒə vu kɔ̃.takt paʁs kə/", it:"La contatto perché…", ex:"Je vous contacte parce que j'ai vu votre site et j'ai remarqué plusieurs points.", exIt:"La contatto perché ho visto il suo sito e ho notato diversi punti.", ctx:"Apertura della chiamata a freddo.", cat:"Présentation"},
{fr:"Je me présente rapidement", ipa:"/ʒə mə pʁe.zɑ̃t ʁa.pid.mɑ̃/", it:"Mi presento rapidamente", ex:"Je me présente rapidement : [nom], spécialisé dans les sites pour vélos.", exIt:"Mi presento rapidamente: [nome], specializzato nei siti per bici.", ctx:"Transizione breve prima delle domande.", cat:"Présentation"},

/* ---------- 3. LE MAGASIN & LE BUSINESS ---------- */
{fr:"Un magasin de vélos", ipa:"/œ̃ ma.ɡa.zɛ̃ də ve.lo/", it:"Un negozio di bici", ex:"Votre magasin de vélos est bien situé à Lausanne.", exIt:"Il suo negozio di bici è ben posizionato a Losanna.", ctx:"Base del vocabolario.", cat:"Magasin", ess:true},
{fr:"Un atelier", ipa:"/œ̃ na.tə.lje/", it:"Un'officina", ex:"L'atelier est un service important pour fidéliser les clients.", exIt:"L'officina è un servizio importante per fidelizzare i clienti.", ctx:"Nel settore bici, l'atelier è spesso il vero centro di profitto.", cat:"Magasin", ess:true},
{fr:"Le propriétaire", ipa:"/lə pʁɔ.pʁje.tɛʁ/", it:"Il proprietario", ex:"Le propriétaire du magasin m'a demandé de l'aide.", exIt:"Il proprietario del negozio mi ha chiesto aiuto.", ctx:"Termine formale.", cat:"Magasin"},
{fr:"Un associé", ipa:"/œ̃ na.sɔ.sje/", it:"Un socio", ex:"Vous êtes le seul décideur, ou il y a un associé ?", exIt:"È l'unico a decidere, o c'è un socio?", ctx:"Domanda chiave per capire chi decide.", cat:"Magasin", ess:true},
{fr:"Le gérant", ipa:"/lə ʒe.ʁɑ̃/", it:"Il gestore", ex:"Le gérant du magasin est aussi mécanicien.", exIt:"Il gestore del negozio è anche meccanico.", ctx:"Alternativa a 'propriétaire'.", cat:"Magasin"},
{fr:"Un mécanicien", ipa:"/œ̃ me.ka.ni.sjɛ̃/", it:"Un meccanico", ex:"Le mécanicien s'occupe du montage et de l'entretien.", exIt:"Il meccanico si occupa del montaggio e della manutenzione.", ctx:"Figura chiave del negozio.", cat:"Magasin"},
{fr:"La boutique", ipa:"/la bu.tik/", it:"Il negozio (fisico)", ex:"En boutique, vous avez un bel espace d'exposition.", exIt:"In negozio, ha un bello spazio espositivo.", ctx:"Indica il punto vendita fisico.", cat:"Magasin"},
{fr:"Le stock", ipa:"/lə stɔk/", it:"La disponibilità / lo stock", ex:"Le stock est-il synchronisé avec le site ?", exIt:"La disponibilità è sincronizzata con il sito?", ctx:"Punto tecnico importante per un e-commerce bici.", cat:"Magasin", ess:true},
{fr:"Le magasin physique", ipa:"/lə ma.ɡa.zɛ̃ fi.zik/", it:"Il negozio fisico", ex:"Le magasin physique reste essentiel pour l'essai des vélos.", exIt:"Il negozio fisico resta essenziale per la prova delle bici.", ctx:"Contrapposto a 'boutique en ligne'.", cat:"Magasin"},
{fr:"La vente en ligne", ipa:"/la vɑ̃t ɑ̃ liɲ/", it:"La vendita online", ex:"La vente en ligne représente encore peu de votre chiffre d'affaires ?", exIt:"La vendita online rappresenta ancora poco del suo fatturato?", ctx:"Domanda utile per capire il business.", cat:"Magasin"},

/* ============================================================
   LOGICA APP
   ============================================================ */
const $ = (id) => document.getElementById(id);
const state = {
  cards: [],
  filtered: [],
  current: 0,
  flipped: false,
  known: new Set(JSON.parse(localStorage.getItem('fr_known') || '[]')),
  category: 'Tutte',
  onlyUnknown: false
};

/* --- Salva su localStorage --- */
function saveKnown(){
  localStorage.setItem('fr_known', JSON.stringify([...state.known]));
  $('knownCount').textContent = state.known.size;
}

/* --- Costruisci filtri --- */
function buildFilters(){
  const cats = ['Tutte', ...new Set(CARDS.map(c => c.cat))];
  const filtersEl = $('filters');
  filtersEl.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (cat === state.category ? ' active' : '');
    btn.dataset.cat = cat;
    const count = cat === 'Tutte' ? CARDS.length : CARDS.filter(c => c.cat === cat).length;
    btn.innerHTML = `${cat} <span class="count">${count}</span>`;
    btn.addEventListener('click', () => {
      state.category = cat;
      state.current = 0;
      state.flipped = false;
      applyFilter();
      document.querySelectorAll('.chip').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
    });
    filtersEl.appendChild(btn);
  });
}

/* --- Applica filtro --- */
function applyFilter(){
  let list = state.category === 'Tutte' ? [...CARDS] : CARDS.filter(c => c.cat === state.category);
  if (state.onlyUnknown) list = list.filter(c => !state.known.has(c.fr));
  state.filtered = list;
  if (state.current >= list.length) state.current = 0;
  render();
}

/* --- Renderizza la carta corrente --- */
function render(){
  const fc = $('flashcard');
  fc.classList.toggle('flipped', state.flipped);
  if (!state.filtered.length){
    $('frWord').textContent = '—';
    $('ipa').textContent = '—';
    $('itWord').textContent = 'Nessuna carta in questa selezione';
    $('exampleFr').textContent = '';
    $('exampleIt').textContent = '';
    $('context').textContent = '';
    $('catTag').textContent = '—';
    $('catTagBack').textContent = '—';
    $('counter').textContent = '0 / 0';
    $('star').style.display = 'none';
    return;
  }
  const c = state.filtered[state.current];
  $('frWord').textContent = c.fr;
  $('ipa').textContent = c.ipa;
  $('itWord').textContent = c.it;
  $('exampleFr').innerHTML = c.ex.replace(new RegExp(c.fr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `<b>${m}</b>`);
  $('exampleIt').textContent = c.exIt;
  $('context').innerHTML = `<b>Contesto:</b> ${c.ctx}`;
  $('catTag').textContent = c.cat;
  $('catTagBack').textContent = c.cat;
  $('star').style.display = c.ess ? 'block' : 'none';
  $('counter').textContent = `${state.current + 1} / ${state.filtered.length}`;
  // aggiorna classe "conosciuta"
  const isKnown = state.known.has(c.fr);
  $('knownBtn').classList.toggle('known-active', isKnown);
  $('knownBtn').innerHTML = isKnown ? '✓ Conosciuta' : '✓ Conosco';
  updateProgress();
}

/* --- Progress bar --- */
function updateProgress(){
  const total = state.filtered.length;
  const pct = total ? ((state.current + 1) / total) * 100 : 0;
  $('progressBar').style.width = pct + '%';
}

/* --- Flip --- */
function flip(){
  state.flipped = !state.flipped;
  $('flashcard').classList.toggle('flipped', state.flipped);
}

/* --- Naviga --- */
function next(){
  if (!state.filtered.length) return;
  state.current = (state.current + 1) % state.filtered.length;
  state.flipped = false;
  render();
}
function prev(){
  if (!state.filtered.length) return;
  state.current = (state.current - 1 + state.filtered.length) % state.filtered.length;
  state.flipped = false;
  render();
}

/* --- Shuffle --- */
function shuffle(){
  for (let i = state.filtered.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [state.filtered[i], state.filtered[j]] = [state.filtered[j], state.filtered[i]];
  }
  state.current = 0;
  state.flipped = false;
  render();
}

/* --- Toggle known --- */
function toggleKnown(){
  if (!state.filtered.length) return;
  const c = state.filtered[state.current];
  if (state.known.has(c.fr)){
    state.known.delete(c.fr);
  } else {
    state.known.add(c.fr);
  }
  saveKnown();
  render();
}

/* --- Toggle "solo sconosciute" --- */
function toggleReview(){
  state.onlyUnknown = !state.onlyUnknown;
  $('reviewBtn').classList.toggle('primary', state.onlyUnknown);
  state.current = 0;
  state.flipped = false;
  applyFilter();
}

/* --- Speech --- */
function speak(text, event){
  if (event) event.stopPropagation();
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  u.rate = 0.85;
  const voices = window.speechSynthesis.getVoices();
  const fr = voices.find(v => v.lang.startsWith('fr'));
  if (fr) u.voice = fr;
  window.speechSynthesis.speak(u);
}

/* --- Eventi --- */
$('flashcard').addEventListener('click', flip);
$('flipBtn').addEventListener('click', flip);
$('nextBtn').addEventListener('click', next);
$('prevBtn').addEventListener('click', prev);
$('shuffleBtn').addEventListener('click', shuffle);
$('knownBtn').addEventListener('click', toggleKnown);
$('reviewBtn').addEventListener('click', toggleReview);
$('speakerBtn').addEventListener('click', (e) => {
  if (!state.filtered.length) return;
  speak(state.filtered[state.current].fr, e);
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight'){ e.preventDefault(); next(); }
  else if (e.code === 'ArrowLeft'){ e.preventDefault(); prev(); }
});

/* --- Init --- */
window.addEventListener('load', () => {
  // pre-carica le voci per la speech
  if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
  buildFilters();
  applyFilter();
  saveKnown();
});
</script>
