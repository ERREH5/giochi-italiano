<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbi Irregolari</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<a href="index.html" class="top-bar">
  🎮 Mini Giochi Italiano
</a>

<div class="card">

  <h2>⚡ Verbi Irregolari</h2>

  <p id="domanda"></p>

  <div id="bottoni"></div>

  <button id="nextBtn" class="next-btn" onclick="nuovaDomanda()" disabled>Avanti</button>

</div>

<script>

// DATI
const verbs = [
{inf:'andare', forms:['vado','vai','va','andiamo','andate','vanno']},
{inf:'venire', forms:['vengo','vieni','viene','veniamo','venite','vengono']},
{inf:'uscire', forms:['esco','esci','esce','usciamo','uscite','escono']},
{inf:'fare', forms:['faccio','fai','fa','facciamo','fate','fanno']},
{inf:'dare', forms:['do','dai','dà','diamo','date','danno']},
{inf:'potere', forms:['posso','puoi','può','possiamo','potete','possono']},
{inf:'volere', forms:['voglio','vuoi','vuole','vogliamo','volete','vogliono']},
{inf:'dovere', forms:['devo','devi','deve','dobbiamo','dovete','devono']},
{inf:'sapere', forms:['so','sai','sa','sappiamo','sapete','sanno']},
{inf:'bere', forms:['bevo','bevi','beve','beviamo','bevete','bevono']}
];

const subjects = ['Io','Tu','Lui/Lei','Noi','Voi','Loro'];

let rispostaCorretta;
let usati = [];

// NUOVA DOMANDA
function nuovaDomanda(){

  document.getElementById('nextBtn').disabled = true;

  if(usati.length === verbs.length){
    document.getElementById('domanda').innerText = "✅ Completato!";
    document.getElementById('bottoni').innerHTML = "";
    return;
  }

  let disponibili = verbs.filter(v => !usati.includes(v));
  let verbo = disponibili[Math.floor(Math.random()*disponibili.length)];

  usati.push(verbo);

  let i = Math.floor(Math.random()*6);

  rispostaCorretta = verbo.forms[i];

  document.getElementById('domanda').innerText =
    subjects[i] + " (" + verbo.inf + ")";

  let opzioni = [...verbo.forms];

  opzioni.sort(() => Math.random() - 0.5);
  opzioni = opzioni.slice(0,4);

  if(!opzioni.includes(rispostaCorretta)){
    opzioni[0] = rispostaCorretta;
  }

  opzioni.sort(() => Math.random() - 0.5);

  let html = '';

  for(let o of opzioni){
    html += `<button onclick="controlla('${o}')">${o}</button>`;
  }

  document.getElementById('bottoni').innerHTML = html;
}

// CONTROLLO
function controlla(val){

  let bottoni = document.querySelectorAll('#bottoni button');

  bottoni.forEach(btn => {

    if(btn.innerText === rispostaCorretta){
      btn.classList.add('correct');
    }

    if(btn.innerText === val && val !== rispostaCorretta){
      btn.classList.add('wrong');
    }

    btn.disabled = true;
  });

  document.getElementById('nextBtn').disabled = false;
}

// AVVIO
nuovaDomanda();

</script>

</body>
</html>
