<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giorni</title>

<link rel="stylesheet" href="style.css">

<style>
.daysBar{
  display:flex;
  justify-content:center;
  gap:5px;
  margin-bottom:15px;
}

.day-box{
  width:40px;
  height:40px;
  background:#3498db;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:8px;
  font-weight:bold;
}

.active-day{
  background:#2ecc71 !important;
}
</style>

</head>

<body>

<a href="index.html" class="top-bar">
  🎮 Mini Giochi Italiano
</a>

<div class="card">

  <h2>📅 Giorni della settimana</h2>

  <div id="daysBar" class="daysBar"></div>

  <p id="domanda"></p>

  <div id="bottoni"></div>

  <button id="nextBtn" class="next-btn" onclick="nuovaDomanda()" disabled>Avanti</button>

</div>

<script>

const days = [
"lunedì",
"martedì",
"mercoledì",
"giovedì",
"venerdì",
"sabato",
"domenica"
];

let usati = [];
let rispostaCorretta = '';
let indexCorr;

// ✅ crea barra numeri
function initBar(){
  document.getElementById('daysBar').innerHTML =
    days.map((d,i)=>`<div class="day-box" id="day${i}">${i+1}</div>`).join('');
}

// ✅ nuova domanda
function nuovaDomanda(){

  document.getElementById('nextBtn').disabled = true;

  // reset colori
  document.querySelectorAll('.day-box').forEach(el=>{
    el.classList.remove('active-day');
  });

  if(usati.length === days.length){
    document.getElementById('domanda').innerText = "✅ Completato!";
    document.getElementById('bottoni').innerHTML = "";
    return;
  }

  let disponibili = [0,1,2,3,4,5,6].filter(i => !usati.includes(i));
  let i = disponibili[Math.floor(Math.random()*disponibili.length)];

  usati.push(i);

  rispostaCorretta = days[i];
  indexCorr = i;

  // evidenzia numero
  document.getElementById('day'+i).classList.add('active-day');

  document.getElementById('domanda').innerText = "Che giorno è?";

  let opzioni = [rispostaCorretta];

  while(opzioni.length < 3){
    let r = days[Math.floor(Math.random()*days.length)];
    if(!opzioni.includes(r)) opzioni.push(r);
  }

  opzioni.sort(()=>Math.random()-0.5);

  let html = "";
  for(let o of opzioni){
    html += `<button onclick="controlla('${o}')">${o}</button>`;
  }

  document.getElementById('bottoni').innerHTML = html;
}

// ✅ controllo
function controlla(val){

  let bottoni = document.querySelectorAll('#bottoni button');

  bottoni.forEach(btn=>{

    if(btn.innerText === rispostaCorretta){
      btn.classList.add('correct');
    }

    if(btn.innerText === val && val !== rispostaCorretta){
      btn.classList.add('wrong');
    }

    btn.disabled = true;
  });

  document.getElementById('nextBtn').disabled = false;
}

// AVVIO
initBar();
nuovaDomanda();

</script>

</body>
</html>
